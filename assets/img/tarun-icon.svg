<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="50" cy="50" r="45" fill="url(#grad1)" stroke="#4a5568" stroke-width="2"/>
  
  <!-- Letter T -->
  <text x="50" y="65" font-family="Arial, sans-serif" font-size="50" font-weight="bold" 
        text-anchor="middle" fill="white" stroke="#2d3748" stroke-width="1">T</text>
  
  <!-- Optional: Add a subtle highlight -->
  <circle cx="35" cy="35" r="8" fill="rgba(255,255,255,0.3)"/>
</svg>
